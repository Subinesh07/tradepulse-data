name: Nightly market scan
on:
  schedule:
    - cron: '45 11 * * 1-5'   # 17:15 IST, after NSE close (Mon–Fri)
    - cron: '30 4 * * 0'      # Sunday 10:00 IST — extra fundamentals refresh
  workflow_dispatch:
  push:
    paths: ['scanner/**', '.github/workflows/nightly.yml']
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Scan all NSE stocks
        env: { FUND_BATCH: '${{ github.event_name == ''schedule'' && ''450'' || ''350'' }}' }
        run: python scanner/scan.py
      - name: Commit results
        run: |
          git config user.name "tradepulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Market scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase -X ours origin main || true
          git push
